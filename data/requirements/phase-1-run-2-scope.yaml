# Phase 1 Run 2 — test scope and automation categorisation
#
# Derived from content/requirements/*.md (current revisions) and the Run 1
# report addendum (novel-it-docs _index.md, "Test Exclusions From Run 2").
#
# Fields:
#   test_id            - matches phase-1.yaml / content/requirements Gherkin tags
#   source_file        - matches phase-1.yaml source_file
#   include_in_run2    - true/false
#   category           - backend_state (Django test client, no browser) or
#                         js_dependent (needs a real browser via Playwright).
#                         Omitted for excluded tests.
#   exclusion_reason   - only present when include_in_run2 is false
#
# Exclusion basis (decided 24-Aug-2026): archive/delete functionality is not
# yet implemented for any planning entity (Character/Location/Item/World
# Building) or for Scene, so tests depending on it stay excluded. World
# Building's other tests (create/edit/fields/images/types/relationships) ARE
# included now that FEAT-0701-0710 is implemented — only its archive/delete
# pair remains excluded, consistent with every other planning entity.
#
# No regression-risk-based skipping is applied. The Run 1 risk analysis that
# skipped unchanged areas was a manual-effort optimisation; with execution
# moving to automated CI, that rationale no longer applies, so every in-scope
# test below runs every time.
#
# Known gaps (see project chat, 24-Aug-2026):
#   - No formal Gherkin scenario exists anywhere in the requirements docs for
#     drag-and-drop reordering of chapters/scenes/parts. The known bugs in
#     chapter_reorder_view / scene_reorder_view / part_reorder_view are real,
#     but automating coverage for them is additional work beyond this file's
#     scope, not a Run 2 requirement.
#   - T-DATA-0410.01.01 / 0510.01.01 / 0610.01.01 / 0710.01.01 (relationships
#     removed when an entity is deleted) are excluded here anyway (delete is
#     unimplemented), but worth noting for whenever they're un-excluded:
#     Relationship's participants are GenericForeignKeys (ContentType +
#     object_id), which Django does NOT cascade-delete automatically. Worth
#     confirming a cleanup signal actually exists before trusting this test.

